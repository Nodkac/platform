apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "demo.fullname" . }}
  labels:
    {{- include "demo.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      # must match the labels on your Service, exactly
      {{- include "demo.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http          # the NAME of the port on the Service, not the number
      path: /metrics
      interval: 15s